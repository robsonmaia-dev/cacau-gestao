name: Atualizar Catalogo Oficial Python

on:
  workflow_dispatch: # Permite rodar com um clique de botão no GitHub (pelo celular ou PC)

permissions:
  contents: write # Permissão para salvar o catalogo.html no repositório

jobs:
  construir-catalogo:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar o código do repositório
        uses: actions/checkout@v4

      - name: Configurar o Python no GitHub
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Instalar biblioteca requests
        run: pip install requests

      - name: Rodar o script Python para extrair o catálogo
        run: python gerar_catalogo.py

      - name: Salvar e publicar o catalogo.html atualizado
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add catalogo.html
          git diff --quiet && git diff --staged --quiet || (git commit -m "Auto: Catalogo atualizado via Python no GitHub" && git push)